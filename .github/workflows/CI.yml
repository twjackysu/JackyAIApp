name: CI

on:
  pull_request:
    branches: [ master ]

jobs:
  build-and-test-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore JackyAIApp.Server/JackyAIApp.Server.csproj

    - name: Restore test dependencies
      run: dotnet restore JackyAIApp.Server.Tests/JackyAIApp.Server.Tests.csproj

    - name: Build Server
      run: dotnet build JackyAIApp.Server/JackyAIApp.Server.csproj --configuration Release --no-restore

    - name: Build Tests
      run: dotnet build JackyAIApp.Server.Tests/JackyAIApp.Server.Tests.csproj --configuration Release --no-restore

    - name: Run tests
      # Excludes live contract tests (THIRD_PARTY_CONTRACT_TESTS_PLAN.md) — those hit real
      # third-party APIs and must never turn an unrelated PR red just because Yahoo/FundRich/etc.
      # is flaky. They run on a separate schedule (contract-tests.yml) instead.
      run: dotnet test JackyAIApp.Server.Tests/JackyAIApp.Server.Tests.csproj --configuration Release --no-build --verbosity normal --filter "Category!=LiveContract" --logger "trx;LogFileName=test-results.trx"
      
    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: JackyAIApp.Server.Tests/TestResults/test-results.trx

  lint-and-build-client:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: jackyaiapp.client

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: jackyaiapp.client/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test
      run: npm run test

    - name: Build
      run: npm run build
