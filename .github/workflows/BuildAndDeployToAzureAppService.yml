name: Build and deploy
on:
  workflow_dispatch:
  push:
    branches:
      - master
    # A push that touches ONLY these paths does not start a run (one code file among them does).
    # Keeps agent notes and docs commits from redeploying production. Nothing under these paths
    # is read at runtime or shipped in the publish output.
    paths-ignore:
      - '.agent/**'
      - '**.md'
env:
  AZURE_WEBAPP_NAME: jackyai-linux
  AZURE_WEBAPP_PACKAGE_PATH: JackyAIApp.Server/publish
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x
  WORKING_DIRECTORY: JackyAIApp.Server
jobs:
  # Linux App Service (jackyai-linux), served at https://apps.jacky-studio.com. The Windows App
  # Service (JackyAI) it replaced is stopped and no longer deployed to.
  build-and-deploy:
    # Every push to master that touches more than docs deploys, whether it arrived through a merged
    # PR or not. workflow_dispatch stays as the way to re-run a deploy and to try a branch:
    # whatever it deploys runs EF migrations against the production DB at startup.
    #
    # One production deploy at a time. A run that arrives while another is deploying waits, and of
    # several waiting runs GitHub keeps only the newest (the replaced ones show as "cancelled" —
    # expected, not a failure). Without this, two quick merges deployed in parallel and whichever
    # finished last won, even if it was the older build. cancel-in-progress stays false so a deploy
    # that is already running is never killed halfway through.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      # azure/webapps-deploy@v3 still runs on Node.js 20; no v4 available yet.
      # Remove once a Node.js 24 compatible version is released.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
    - uses: actions/checkout@v6
      with:
        # Deploy the tip of master as it is when this run starts checking out — NOT the commit that
        # triggered it. With an explicit ref, checkout fetches that ref's current tip; without one
        # it pins the event's github.sha, which for a run that waited in the queue is already stale.
        # Because the content of every push is already on master, master's tip can only move
        # production forward, so it does not matter in which order runs are queued or finish: the
        # last one to run always leaves the newest master deployed. (A run deploying the same tip
        # as the one before it is a harmless repeat.) workflow_dispatch keeps github.ref, the
        # branch chosen in the "Run workflow" dialog.
        ref: ${{ github.event_name == 'push' && 'master' || github.ref }}
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
    - name: Build
      run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Test
      run: dotnet test "JackyAIApp.Server.Tests" --configuration ${{ env.CONFIGURATION }} --filter "Category!=LiveContract"
    - name: Publish
      run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.JACKYAI_LINUX_PUBLISH_PROFILE }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
